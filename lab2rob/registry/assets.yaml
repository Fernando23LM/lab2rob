# Objects lab2rob scenes may contain. All dimensions in metres. Status:
# implemented = buildable by the biolab scene code or lab2rob/build/labware.py;
# declared = known wet-lab object with no simulator support (out_of_scope:
# not_implemented).
# Affordances: graspable, movable, insertable (fits a rack cell), openable,
# pourable, containable (holds liquid), weighable (mass is readable), fixed
# (cannot be moved), support (things rest on it). Licenses per rule 7;
# scene-built labware inherits the source repo, which has no LICENSE file;
# labware.py labware takes its dimensions from Apache-2.0 Opentrons definitions.
assets:
  - name: yam_arm
    status: implemented
    description: One I2RT YAM 6-dof arm with a parallel gripper; scenes always have two (left/right).
    dimensions:
      straight_down_reach_min_m: 0.10
      straight_down_reach_max_m: 0.35
      straight_down_height_max_m: 0.16
      gripper_opening_min_m: 0.0
      gripper_opening_max_m: 0.082
      fingertip_below_pinch_m: 0.017
      finger_plate_width_m: 0.012
    affordances: []
    license: MIT (Copyright (c) 2025 i2rt robotics)
    source: third_party/mujoco_menagerie/i2rt_yam/yam.xml via scene.py build_spec
  - name: rack
    status: implemented
    description: Fixed bench rack, grid of square cells sized for 28 mm vials.
    dimensions:
      height_m: 0.035
      base_thickness_m: 0.006
      cell_opening_m: 0.032
      cell_pitch_m: 0.037
      wall_m: 0.005
      grids: ["4x2 standard", "2x1 handover"]
    affordances: [fixed]
    license: UNKNOWN (no LICENSE file in source repo)
    source: scene.py Rack dataclass and _add_rack
  - name: tube_vial
    status: implemented
    description: Capped sample vial, free to grasp and move between rack cells.
    dimensions:
      diameter_m: 0.028
      height_m: 0.075
      mass_kg: 0.03
    affordances: [graspable, movable, insertable]
    license: UNKNOWN (no LICENSE file in source repo)
    source: scene.py _add_tube
  - name: snap_tube
    status: implemented
    description: Tube clamped upright in its rack cell with a hinged flat lid; only the lid moves.
    dimensions:
      body_diameter_m: 0.022
      height_m: 0.075
      lid_length_m: 0.030
      lid_width_m: 0.028
      lid_thickness_m: 0.010
      lid_max_angle_rad: 2.2
      latch_release_angle_rad: 0.12
      latch_force_at_edge_N: 3.0
    affordances: [openable, fixed]
    license: UNKNOWN (no LICENSE file in source repo)
    source: scene.py _add_snap_tube
  - name: salt_vial
    status: implemented
    description: Open 28 mm vial with a cup of ~2.4 g coarse salt in its top; spills when leaned.
    dimensions:
      diameter_m: 0.028
      height_m: 0.075
      cup_depth_m: 0.015
      cup_floor_radius_m: 0.0072
      salt_mass_g: 2.4
    affordances: [graspable, movable, insertable, pourable]
    license: UNKNOWN (no LICENSE file in source repo)
    source: scene.py _add_salt_vial
  - name: salt_grain
    status: implemented
    description: One loose salt grain; simulated individually, 68 per salt vial.
    dimensions:
      diameter_min_m: 0.0028
      diameter_max_m: 0.0036
      mass_min_g: 0.02
      mass_max_g: 0.05
    affordances: [pourable]
    part_of: salt_vial
    license: UNKNOWN (no LICENSE file in source repo)
    source: scene.py _add_salt_vial
  - name: balance
    status: implemented
    description: Balance with a tared square weigh boat fixed on its pan; reading in grams.
    dimensions:
      pan_top_height_m: 0.028
      boat_inner_size_m: 0.064
      boat_rim_m: 0.012
    affordances: [weighable, fixed]
    license: UNKNOWN (no LICENSE file in source repo)
    source: scene.py _add_balance
  - name: table
    status: implemented
    description: Bench top at z = 0; everything stands on it.
    dimensions:
      size_x_m: 0.90
      size_y_m: 1.20
      top_z_m: 0.0
    affordances: [fixed, support]
    license: UNKNOWN (no LICENSE file in source repo)
    source: scene.py build_spec
  - name: floor
