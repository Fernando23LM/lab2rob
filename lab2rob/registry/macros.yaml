# Skill macros: named expansions into implemented primitives (validated by
# gen_skills.py: every step must be implemented or another macro, with no
# cycles, so everything bottoms out in real simulator calls). Argument binding
# is the program planner's job (SC-01); steps are ordered skill names.
# NOTE: change_tip is deliberately NOT a macro — the simulated pipette has no
# tip state (see liquid.py Pipette), so it is a declared skill instead.
macros:
  - name: transfer
    kind: action
    description: Move liquid from one well to another with the held pipette.
    params: [source, target, volume_ul]
    steps: [aspirate, dispense]
  - name: mix_by_pipetting
    kind: action
    description: Mix a well by repeated aspirate/dispense cycles in place.
    params: [well, volume_ul, cycles]
    steps: [aspirate, dispense]
  - name: serial_dilution
    kind: action
    description: Build a dilution series across target wells from a source well.
    params: [source, targets, volume_ul, dilution_factor]
    steps: [transfer]
  - name: dilute
    kind: action
    description: Add MilliQ water diluent to reach target volume
    params: [diluent_volume_ml]
    steps: [aspirate, dispense]
    learned: true
  - name: weigh_sample
    kind: action
    description: >-
      Weigh out a mass of a granular solid onto the balance's weigh boat (Autoprotocol
      op weigh): one arm brings the vial to the shared rack, the other pours in small
      tilts, reading the balance, until it is within the target. Runs in the weighing
      scene only; the expansion is the reference script in
      lab2rob/robocurve/runtime/task.py (demo_script).
    params: [mass_g, reagent]
    steps: [get_tube_pose, get_rack, get_balance, move_to, set_gripper, go_home, wait]
  - name: centrifuge
    kind: action
    description: >-
      Centrifuge sample tubes (Autoprotocol op spin): load them into opposite rotor
      slots so it is balanced, then shut the lid. Runs in the centrifuge scene only;
      nothing spins, the speed and time are recorded. The expansion is the reference
      script in lab2rob/robocurve/runtime/centrifuge_family.py (DEMO).
    params: [tubes, speed, time_s]
    steps: [get_tube_pose, get_rack, move_to, set_gripper, go_home, wait]
