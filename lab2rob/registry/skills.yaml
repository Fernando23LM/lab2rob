  kind: action
  variants:
    SnapCapApi:
      module: biolab.api
      signature: '(arm: str, opening: float) -> None'
      doc: "Open or close a gripper and wait for it to settle.\n\nEach finger is a flat plate 12 mm wide. The fingertips reach 17 mm below\nthe pinch point, and the fingers always hang straight down from the\ngripper (or lean with `tilt`); they do not turn with what they hold.\n\nArgs:\n    arm: \"left\" or \"right\".\n    opening: commanded distance between the finger pads in metres, from\n      0.0 to 0.082. The fingers are position-controlled springs: they\n      stop on whatever they hold and squeeze with a force proportional\n      to how far the command is below the object (about 0.5 N per mm,\n      40 N at most). Command 0.0 for a firm grip."
    TubeRackApi:
      module: biolab.api
      signature: '(arm: str, opening: float) -> None'
      doc: "Open or close a gripper and wait for it to settle.\n\nThe fingers do not fit between vials in touching cells. The two vials\nnever start in touching cells, so at the source rack the cells around\nthe vial to grasp are free.\n\nArgs:\n    arm: \"left\" or \"right\".\n    opening: commanded distance between the finger pads in metres, from\n      0.0 to 0.082. The fingers are position-controlled springs: they\n      stop on whatever they hold and squeeze with a force proportional\n      to how far the command is below the object (about 0.5 N per mm,\n      40 N at most). Command 0.0 for a firm grip. A held 28 mm vial\n      reads as an opening of about 0.025, so commanding 0.025 applies\n      almost no force."
    WeighApi:
      module: biolab.api
      signature: '(arm: str, opening: float) -> None'
      doc: "Open or close a gripper and wait for it to settle.\n\nEach finger is a flat plate 12 mm wide. The fingertips reach 17 mm below\nthe pinch point.\n\nArgs:\n    arm: \"left\" or \"right\".\n    opening: commanded distance between the finger pads in metres, from\n      0.0 to 0.082. The fingers are position-controlled springs: they\n      stop on whatever they hold and squeeze with a force proportional\n      to how far the command is below the object (about 0.5 N per mm,\n      40 N at most). Command 0.0 for a firm grip."
- name: sonicate
  status: declared
  kind: action
  description: Disrupt by ultrasound bath or probe.
- name: stamp_transfer
  status: declared
  kind: action
  description: Replicate many wells at once with a pin tool.
- name: thaw
  status: declared
  kind: action
  description: Thaw frozen reagents or cells.
- name: thermocycle
  status: declared
  kind: action
  description: Run PCR temperature cycles (Autoprotocol op thermocycle).
- name: transfer
  status: macro
  kind: action
  description: Move liquid from one well to another with the held pipette.
  params:
  - source
  - target
  - volume_ul
  steps:
  - aspirate
  - dispense
- name: uncover_plate
  status: declared
  kind: action
  description: Remove a plate lid (Autoprotocol op uncover).
- name: unseal_plate
  status: declared
  kind: action
  description: Remove plate seal film (Autoprotocol op unseal).
- name: uv_sterilize
  status: declared
  kind: action
  description: Sterilize surfaces with UV light.
- name: vortex
  status: declared
  kind: action
  description: Mix a tube on a vortexer.
- name: wait
  status: implemented
  kind: action
  variants:
    ProteinApi:
      module: biolab.protein
      signature: '(seconds: float) -> None'
      doc: "Hold still and let time pass.\n\nArgs:\n    seconds: how long to wait, at most 5."
    WeighApi:
      module: biolab.api
      signature: '(seconds: float) -> None'
      doc: "Hold still and let time pass, for example while the balance settles.\n\nArgs:\n    seconds: how long to wait, at most 5."
- name: wash_plate
  status: declared
  kind: action
  description: Wash plate wells with buffer, one or more cycles.
- name: weigh_sample
  status: macro
  kind: action
  description: 'Weigh out a mass of a granular solid onto the balance''s weigh boat (Autoprotocol op weigh): one arm brings the vial to the shared rack, the other pours in small tilts, reading the balance, until it is within the target. Runs in the weighing scene only; the expansion is the reference script in lab2rob/robocurve/runtime/task.py (demo_script).'
  params:
  - mass_g
  - reagent
  steps:
  - get_tube_pose
  - get_rack
  - get_balance
  - move_to
  - set_gripper
  - go_home
  - wait
